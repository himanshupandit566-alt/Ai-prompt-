name: smart_notes_ai
description: A production-ready, modern, minimalist offline-first Android notes application built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Persistence
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Utilities & Security
  crypto: ^3.0.3
  intl: ^0.19.0
  uuid: ^4.4.0

  # Device Hardware & Permissions
  flutter_local_notifications: ^17.2.1
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Sharing & Import/Export
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
